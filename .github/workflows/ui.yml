name: Dashboard assets

on:
  push:
    branches: [feature, main]
  pull_request:

jobs:
  generated-assets:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: Verify deterministic UI build
        run: python tools/build_ui.py --check
      - name: Run dashboard and lwIP contracts
        run: |
          python tests/test_dashboard_static.py
          python tests/test_v3_visual_contract.py
          python tests/test_v4_digital_twin.py
          python tests/test_http_large_response.py
          python tests/test_lwip_pbuf_contract.py
          python tests/test_web_auth_contract.py
