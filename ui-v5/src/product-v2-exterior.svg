<svg class="product-v2-illustration" id="productV2Illustration" viewBox="175 72 570 666" role="img" aria-labelledby="v2Title v2Description" xmlns="http://www.w3.org/2000/svg">
 <title id="v2Title">Premium-Produktentwurf des intelligenten Becherhalters</title>
 <desc id="v2Description">Ein normal proportionierter Glasbecher sitzt tief in einem kompakten anthrazitfarbenen Tischgerät. Eine runde Aufnahme, zwei integrierte thermische Seitenmodule, ein bündiges OLED, vier Taster und eine seitliche Lüftungsöffnung bilden ein geschlossenes Produkt.</desc>
 <defs>
  <linearGradient id="v2Glass" x1="0" y1="0" x2="1" y2="0"><stop stop-color="#73827e" stop-opacity=".48"/><stop offset=".18" stop-color="#eaf0ed" stop-opacity=".72"/><stop offset=".42" stop-color="#9aa8a4" stop-opacity=".28"/><stop offset=".76" stop-color="#e6ece9" stop-opacity=".56"/><stop offset="1" stop-color="#5d6a66" stop-opacity=".42"/></linearGradient>
  <linearGradient id="v2Drink" x1="0" y1="0" x2=".65" y2="1"><stop stop-color="#d58a50"/><stop offset=".48" stop-color="#ae623c"/><stop offset="1" stop-color="#713724"/></linearGradient>
  <linearGradient id="v2Top" x1=".1" y1="0" x2=".9" y2="1"><stop stop-color="#565e59"/><stop offset=".36" stop-color="#3a413c"/><stop offset="1" stop-color="#252b27"/></linearGradient>
  <linearGradient id="v2Front" x1="0" y1="0" x2=".72" y2="1"><stop stop-color="#424a45"/><stop offset=".45" stop-color="#303632"/><stop offset="1" stop-color="#202521"/></linearGradient>
  <linearGradient id="v2Right" x1="0" y1="0" x2="1" y2=".8"><stop stop-color="#333a35"/><stop offset="1" stop-color="#181d1a"/></linearGradient>
  <linearGradient id="v2Module" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#4e5651"/><stop offset=".55" stop-color="#393f3b"/><stop offset="1" stop-color="#292f2b"/></linearGradient>
  <linearGradient id="v2Metal" x1="0" y1="0" x2="1" y2=".2"><stop stop-color="#747d78"/><stop offset=".28" stop-color="#c3c9c5"/><stop offset=".5" stop-color="#7e8782"/><stop offset=".76" stop-color="#d3d7d3"/><stop offset="1" stop-color="#59615d"/></linearGradient>
  <radialGradient id="v2Ambient"><stop stop-color="#59635c" stop-opacity=".2"/><stop offset="1" stop-color="#111410" stop-opacity="0"/></radialGradient>
  <filter id="v2ContactShadow" x="-30%" y="-30%" width="160%" height="180%"><feGaussianBlur stdDeviation="7"/></filter>
  <clipPath id="v2CupClip"><path d="M328 129Q454 99 580 129L560 389Q554 435 454 443Q354 435 348 389Z"/></clipPath>
 </defs>

 <ellipse cx="460" cy="390" rx="340" ry="310" fill="url(#v2Ambient)"/>
 <ellipse class="v2-ground-shadow" cx="454" cy="706" rx="222" ry="22" fill="#050706" opacity=".43" filter="url(#v2ContactShadow)"/>

 <g class="product-v2-exterior">
  <!-- Phase B: a broad, lightly tapered beverage glass and one liquid body. -->
  <g class="v2-cup">
   <path d="M328 129Q454 99 580 129L560 389Q554 435 454 443Q354 435 348 389Z" fill="url(#v2Glass)"/>
   <g clip-path="url(#v2CupClip)"><path d="M345 181Q454 155 563 181L548 389Q542 418 454 426Q366 418 360 389Z" fill="url(#v2Drink)" opacity=".84"/><ellipse cx="454" cy="181" rx="109" ry="24" fill="#d48a50"/><ellipse cx="454" cy="183" rx="89" ry="16" fill="#884628" opacity=".63"/></g>
   <ellipse cx="454" cy="129" rx="126" ry="29" fill="#cbd6d2" fill-opacity=".1" stroke="#d8dfdb" stroke-width="3"/>
   <path d="M352 151Q355 278 368 383" fill="none" stroke="#fff" stroke-width="4" stroke-linecap="round" opacity=".15"/>
  </g>

  <!-- Phase A: one compact housing with an intentionally simple silhouette. -->
  <g class="v2-housing">
   <path d="M226 391Q234 354 284 337Q367 307 445 306Q555 305 648 336Q688 350 695 384L670 433Q552 476 430 484Q327 475 244 444Z" fill="url(#v2Top)"/>
   <path d="M244 433Q337 475 430 484Q546 476 670 423L650 616Q642 661 430 688Q267 664 256 620Z" fill="url(#v2Front)"/>
   <path d="M430 484Q552 476 670 423L650 616Q642 648 430 688Z" fill="url(#v2Right)" opacity=".97"/>
   <path d="M257 614Q347 644 430 655Q543 644 650 611L648 639Q621 673 430 699Q282 677 257 643Z" fill="#151a17" opacity=".95"/>
   <path d="M430 486Q552 477 670 426" fill="none" stroke="#68716b" stroke-width="1" opacity=".26"/>
   <path d="M266 438Q274 566 286 620" fill="none" stroke="#aeb7b1" stroke-width="2" opacity=".08"/>
   <path d="M651 445Q648 548 638 611" fill="none" stroke="#c6cec9" stroke-width="2" opacity=".1"/>
  </g>

  <!-- The cup sits behind this collar and therefore visibly inside the appliance. -->
  <g class="v2-collar">
   <ellipse cx="454" cy="382" rx="150" ry="31" fill="#080b09" opacity=".48" filter="url(#v2ContactShadow)"/>
   <ellipse cx="454" cy="359" rx="166" ry="44" fill="#222824"/>
   <ellipse cx="454" cy="356" rx="162" ry="42" fill="none" stroke="url(#v2Metal)" stroke-width="10" opacity=".64"/>
   <ellipse cx="454" cy="358" rx="139" ry="32" fill="#1b211d"/>
   <ellipse cx="454" cy="369" rx="126" ry="23" fill="#343b36" opacity=".9"/>
   <path d="M337 370Q454 405 571 370" fill="none" stroke="#0b0e0c" stroke-width="5" opacity=".72"/>
   <path d="M350 368Q454 392 558 368" fill="none" stroke="#69716c" stroke-width="2" opacity=".35"/>
   <ellipse class="v2-rgb" cx="454" cy="356" rx="156" ry="39" fill="none" stroke="#a9633f" stroke-width="2" stroke-dasharray="2 24" stroke-linecap="round" opacity=".42"/>
  </g>

  <!-- Phase D: symmetric thermal pods are flush with the housing. -->
  <g class="v2-side-modules">
   <path d="M231 391Q239 359 281 343L301 364L291 487Q280 505 251 506Z" fill="url(#v2Module)"/>
   <path d="M686 386Q680 355 647 343L625 365L635 485Q646 504 671 503Z" fill="url(#v2Module)"/>
   <path d="M248 385Q254 366 278 356L286 372L279 478Q271 490 259 487Z" fill="#69716c" opacity=".25"/>
   <path d="M669 382Q664 365 647 357L638 372L645 477Q653 488 663 486Z" fill="#69716c" opacity=".22"/>
   <path d="M290 390Q292 427 287 462" fill="none" stroke="#b8734d" stroke-width="4" stroke-linecap="round" opacity=".42"/>
   <path d="M631 389Q629 426 634 460" fill="none" stroke="#b8734d" stroke-width="4" stroke-linecap="round" opacity=".42"/>
   <path d="M248 503Q271 520 293 493" fill="none" stroke="#171c19" stroke-width="8" opacity=".48"/>
   <path d="M632 491Q650 516 672 500" fill="none" stroke="#171c19" stroke-width="8" opacity=".48"/>
  </g>

  <!-- Phase C: one recessed, centered control module. -->
  <g class="v2-front-panel">
   <path d="M321 506Q426 530 531 510L524 633Q425 651 329 630Z" fill="#151a17"/>
   <path d="M343 528Q426 545 509 529L506 586Q426 600 346 584Z" fill="#060a09"/>
   <path d="M356 536Q426 549 496 537L494 577Q426 588 358 577Z" fill="#0c282c"/>
   <text x="376" y="567" fill="#c7ece8" font-family="Segoe UI, sans-serif" font-size="24" font-weight="500">32.4°</text>
   <text x="465" y="566" fill="#82a5a5" font-family="Segoe UI, sans-serif" font-size="9" font-weight="600">45.0°</text>
   <g fill="#141815" opacity=".95"><ellipse cx="363" cy="608" rx="12" ry="6"/><ellipse cx="405" cy="614" rx="12" ry="6"/><ellipse cx="447" cy="614" rx="12" ry="6"/><ellipse cx="489" cy="608" rx="12" ry="6"/></g>
   <g class="v2-buttons" fill="#68716c" stroke="#929b95" stroke-width="1"><circle cx="363" cy="604" r="9"/><circle cx="405" cy="610" r="9"/><circle cx="447" cy="610" r="9"/><circle cx="489" cy="604" r="9"/></g>
   <g fill="#a9b2ac" font-family="Segoe UI, sans-serif" font-size="6.5" font-weight="600" text-anchor="middle"><text x="363" y="627">MODE</text><text x="405" y="634">DOWN</text><text x="447" y="634">OK</text><text x="489" y="627">UP</text></g>
  </g>

  <!-- Exterior cooling is communicated by a quiet side vent, never a bare fan. -->
  <g class="v2-side-vent" opacity=".86">
   <path d="M557 530Q606 520 650 497L643 599Q602 615 558 622Z" fill="#0b0e0c"/>
   <path d="M568 545Q603 537 635 521L630 585Q599 597 567 603Z" fill="#1b211d" stroke="#59615c" stroke-width="1"/>
   <g fill="none" stroke="#77807a" stroke-width="4" stroke-linecap="round"><path d="M578 548 575 594"/><path d="M590 545 587 591"/><path d="M602 541 598 587"/><path d="M614 536 609 582"/><path d="M626 530 620 577"/></g>
  </g>

  <!-- Phase E: sparse studio highlights, no per-component glow. -->
  <path d="M278 455Q303 568 397 631" fill="none" stroke="#fff" stroke-width="3" opacity=".045"/>
  <path d="M646 446Q627 481 615 504" fill="none" stroke="#cdd5d0" stroke-width="2" opacity=".07"/>
 </g>
</svg>
