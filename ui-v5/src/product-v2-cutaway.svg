<svg class="product-illustration product-v2-illustration product-v2-cutaway product-step-render" id="productV2Cutaway" viewBox="0 0 702 1100" role="img" aria-labelledby="productCutTitle productCutDescription" xmlns="http://www.w3.org/2000/svg">
 <title id="productCutTitle">ThermoCup MK I Innenansicht</title>
 <desc id="productCutDescription">Einheitliche fotorealistische Schnittansicht derselben STEP-Gehäusegeometrie: tief eingesetzter Becher, zwei seitliche Peltierkontakte, zwei TMP36, mechanische Bechererkennung, ein horizontaler Lüfter, originales 80-mm-PCB mit Pico W sowie eingelassenes OLED und vier Taster.</desc>
 <image href="__PRODUCT_CUTAWAY__" x="0" y="0" width="702" height="1100" preserveAspectRatio="xMidYMid meet"/>

 <!-- Invisible, focusable interaction geometry; no visible component sprites. -->
 <g class="step-interaction-layer" fill="transparent" stroke="transparent">
  <rect class="component-part step-hotspot" data-part="temp1" data-focus="temp1" x="462" y="82" width="78" height="122" rx="16" tabindex="0" role="button" aria-label="TMP36 Sensor 1 als kleines TO-92-Bauteil oben seitlich am Becher"/>
  <rect class="component-part step-hotspot" data-part="temp2" data-focus="temp2" x="324" y="596" width="90" height="116" rx="22" tabindex="0" role="button" aria-label="TMP36 Sensor 2 auf kompaktem Federkontakt mittig unter dem Becher"/>
  <rect class="component-part step-hotspot" data-part="peltier1" data-focus="peltier1" x="205" y="267" width="106" height="313" rx="14" tabindex="0" role="button" aria-label="Peltier links mit weißer Keramik und gebürstetem Metallkontakt"/>
  <rect class="component-part step-hotspot" data-part="peltier2" data-focus="peltier2" x="443" y="267" width="103" height="313" rx="14" tabindex="0" role="button" aria-label="Peltier rechts mit weißer Keramik und gebürstetem Metallkontakt"/>
  <rect class="component-part step-hotspot" data-part="fan" data-focus="fan" x="218" y="638" width="275" height="175" rx="28" tabindex="0" role="button" aria-label="Ein einzelner horizontaler 4-Pin PWM-Lüfter unter dem Becher"/>
  <rect class="component-part step-hotspot" data-part="oled" data-focus="oled" x="493" y="827" width="162" height="166" rx="18" tabindex="0" role="button" aria-label="SSD1306 OLED vollständig in der unteren Frontaussparung"/>
  <rect class="component-part step-hotspot" data-part="buttons" data-focus="buttons" x="494" y="958" width="155" height="84" rx="18" tabindex="0" role="button" aria-label="Vier eingelassene Taster MODE, DOWN, OK und UP direkt unter dem OLED"/>
  <ellipse class="component-part step-hotspot" data-part="rgb" data-focus="rgb" cx="351" cy="110" rx="250" ry="90" tabindex="0" role="button" aria-label="RGB-Statusring im oberen Becherbereich"/>
  <rect class="component-part step-hotspot" data-part="light" data-focus="light" x="318" y="958" width="94" height="81" rx="20" tabindex="0" role="button" aria-label="Kleiner optischer Lichtsensor in der untersten Frontöffnung"/>
  <rect class="component-part step-hotspot" data-part="cup" data-focus="cup" x="440" y="574" width="145" height="100" rx="20" tabindex="0" role="button" aria-label="Seitlicher mechanischer Becherschalter mit langem flachem Taststößel"/>
  <ellipse class="component-part step-hotspot" data-part="pico" data-focus="pico" cx="355" cy="842" rx="198" ry="123" tabindex="0" role="button" aria-label="Originales 80-Millimeter-Haupt-PCB mit darauf montiertem Raspberry Pi Pico W"/>
  <rect class="component-part step-hotspot" data-part="current1" data-focus="current1" x="292" y="759" width="218" height="139" rx="24" tabindex="0" role="button" aria-label="TLA2024 und Strommessung auf dem originalen Haupt-PCB"/>
 </g>

 <g class="callout-anchors" aria-hidden="true">
  <circle data-callout-anchor="temp1" cx="501" cy="143" r="2"/>
  <circle data-callout-anchor="temp2" cx="369" cy="654" r="2"/>
  <circle data-callout-anchor="peltier1" cx="258" cy="424" r="2"/>
