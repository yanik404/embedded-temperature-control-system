<svg class="product-illustration product-v2-illustration product-v2-cutaway product-step-render" id="productV2Cutaway" viewBox="0 0 702 1100" role="img" aria-labelledby="productCutTitle productCutDescription" xmlns="http://www.w3.org/2000/svg">
 <title id="productCutTitle">ThermoCup MK I Innenansicht</title>
 <desc id="productCutDescription">Schnittansicht der STEP-Gehäusegeometrie mit einzeln auswählbaren realen Bauformen: zwei Peltiermodule, zwei TMP36, mechanische Bechererkennung, ein Lüfter, originales 80-mm-PCB, Pico W, OLED, Taster und Lichtsensor.</desc>
 <defs>
  <linearGradient id="realMetal" x1="0" x2="1"><stop offset="0" stop-color="#f3f5f1"/><stop offset=".16" stop-color="#aab1ad"/><stop offset=".34" stop-color="#f7f8f5"/><stop offset=".58" stop-color="#8b9490"/><stop offset=".82" stop-color="#e7ebe7"/><stop offset="1" stop-color="#747c78"/></linearGradient>
  <linearGradient id="realCeramic" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#fff"/><stop offset=".58" stop-color="#dce4e3"/><stop offset="1" stop-color="#abb7b5"/></linearGradient>
  <linearGradient id="realBlack" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#3c4340"/><stop offset=".38" stop-color="#151918"/><stop offset="1" stop-color="#050706"/></linearGradient>
  <radialGradient id="photoCell" cx="35%" cy="30%"><stop offset="0" stop-color="#e8f3b9"/><stop offset=".34" stop-color="#95ad5e"/><stop offset=".72" stop-color="#354525"/><stop offset="1" stop-color="#11170d"/></radialGradient>
  <filter id="realPartShadow" x="-40%" y="-40%" width="180%" height="180%"><feDropShadow dx="0" dy="5" stdDeviation="5" flood-color="#000" flood-opacity=".72"/></filter>
  <clipPath id="originalPcbClip"><ellipse cx="359" cy="848" rx="153" ry="90"/></clipPath>
 </defs>

 <image href="__PRODUCT_CUTAWAY__" x="0" y="0" width="702" height="1100" preserveAspectRatio="xMidYMid meet"/>

 <!-- Neutral mounting covers hide the illustrative placeholders in the base render. -->
 <g class="real-component-mounts" aria-hidden="true">
  <rect x="245" y="205" width="58" height="84" rx="13" fill="#101412" opacity=".94"/>
  <rect x="501" y="533" width="61" height="76" rx="12" fill="#111513" opacity=".94"/>
  <ellipse cx="359" cy="848" rx="160" ry="95" fill="#0b0e0c" opacity=".96"/>
  <rect x="340" y="954" width="58" height="48" rx="12" fill="#111512" opacity=".94"/>
 </g>

 <!-- Ceramic Peltier heaters with brushed aluminium contact faces; never red-striped. -->
 <g class="component-part component-real real-peltier" data-part="peltier1" filter="url(#realPartShadow)" aria-hidden="true">
  <path d="M250 304l63 10v246l-63-15z" fill="url(#realCeramic)" stroke="#eef2ef" stroke-width="4"/>
  <path class="peltier-contact-face" d="M258 313l47 8v228l-47-11z" fill="url(#realMetal)"/>
  <path d="M267 321v215M280 323v216M293 326v216" stroke="#fff" stroke-opacity=".17"/>
  <circle cx="256" cy="315" r="3" fill="#555d59"/><circle cx="256" cy="540" r="3" fill="#555d59"/>
 </g>
 <g class="component-part component-real real-peltier" data-part="peltier2" filter="url(#realPartShadow)" aria-hidden="true">
  <path d="M475 319l59-13v239l-59 17z" fill="url(#realCeramic)" stroke="#eef2ef" stroke-width="4"/>
  <path class="peltier-contact-face" d="M483 326l43-10v222l-43 13z" fill="url(#realMetal)"/>
  <path d="M493 324v224M505 321v224M517 319v222" stroke="#fff" stroke-opacity=".16"/>
  <circle cx="528" cy="318" r="3" fill="#555d59"/><circle cx="528" cy="538" r="3" fill="#555d59"/>
 </g>

 <!-- TMP36 #1: recognisable black TO-92 body with exactly three silver leads. -->
 <g class="component-part component-real real-tmp36" data-part="temp1" filter="url(#realPartShadow)" aria-hidden="true">
  <path d="M257 220q0-15 17-18q17 3 17 18v30h-34z" fill="url(#realBlack)" stroke="#6f7974" stroke-width="1.5"/>
  <path d="M263 250v25M274 250v30M285 250v25" fill="none" stroke="#c9d0cc" stroke-width="3"/>
  <path d="M260 211q14-8 28 1" fill="none" stroke="#7f8984" stroke-width="2" opacity=".65"/>
 </g>

 <!-- TMP36 #2 sits directly below the cup on a visible spring contact. -->
 <g class="component-part component-real real-tmp36 spring-sensor" data-part="temp2" filter="url(#realPartShadow)" aria-hidden="true">
  <path d="M350 610q0-13 16-15q16 2 16 15v25h-32z" fill="url(#realBlack)" stroke="#77817c" stroke-width="1.5"/>
  <path d="M357 635v10M366 635v10M375 635v10" stroke="#d1d6d2" stroke-width="2.5"/>
  <path d="M366 643c-25 6 25 12 0 18s25 12 0 18s25 12 0 18" fill="none" stroke="#cbd0cc" stroke-width="4" stroke-linecap="round"/>
  <ellipse cx="366" cy="700" rx="27" ry="6" fill="#1b211e" stroke="#737d77" stroke-width="2"/>
 </g>

 <!-- One horizontal 4-pin fan under the cup. -->
 <g class="component-part component-real real-fan" data-part="fan" filter="url(#realPartShadow)" aria-hidden="true">
  <path d="M284 676l180-5l11 94l-185 7z" fill="#101412" stroke="#515a55" stroke-width="5"/>
  <ellipse cx="375" cy="721" rx="77" ry="43" fill="#080a09" stroke="#343b37" stroke-width="4"/>
  <g class="fan-rotor" transform="translate(375 721) scale(.68 .58)">
   <path d="M0-8C-17-48-50-53-56-41c-6 12 20 29 45 38zM8 0c40-17 53-1 48 13c-5 13-38 11-59-3zM0 8c17 39 2 60-13 55c-15-5-14-37 3-58zM-8 0c-39 17-58 1-49-13c8-13 38-10 60 3z" fill="#363d39" stroke="#656e69" stroke-width="1.5"/>
   <circle r="16" fill="#858d88"/><circle r="7" fill="#252a27"/>
  </g>
 </g>

 <!-- Mechanical side switch: the long flat plunger is pressed by the inserted cup. -->
 <g class="component-part component-real real-cup-switch" data-part="cup" filter="url(#realPartShadow)" aria-hidden="true">
  <rect x="525" y="548" width="39" height="58" rx="6" fill="#171b19" stroke="#737c77" stroke-width="2"/>
  <circle cx="536" cy="560" r="3.5" fill="#c4cbc7"/><circle cx="552" cy="594" r="3.5" fill="#c4cbc7"/>
  <path class="cup-detector-plunger" d="M530 566h-47l-12 6l12 6h47z" fill="url(#realMetal)" stroke="#d9dedb" stroke-width="1.5"/>
  <rect x="531" y="571" width="12" height="5" rx="2" fill="#bb6d35"/>
 </g>

