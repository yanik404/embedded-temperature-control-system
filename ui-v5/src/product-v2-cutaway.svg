  <rect class="component-part step-hotspot" data-part="light" data-focus="light" x="337" y="950" width="65" height="55" rx="15" tabindex="0" role="button" aria-label="Physischer Lichtsensor im unteren Gehäusebereich"/>
  <rect class="component-part step-hotspot" data-part="cup" data-focus="cup" x="463" y="538" width="110" height="81" rx="18" tabindex="0" role="button" aria-label="Mechanischer seitlicher Becherschalter mit langem flachem Taststößel"/>
  <ellipse class="component-part step-hotspot" data-part="pico" data-focus="pico" cx="359" cy="848" rx="165" ry="100" tabindex="0" role="button" aria-label="Originales 80-Millimeter-Haupt-PCB mit Raspberry Pi Pico W"/>
