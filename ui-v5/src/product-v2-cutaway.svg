  <circle data-callout-anchor="oled" cx="574" cy="910" r="2"/>
  <circle data-callout-anchor="buttons" cx="572" cy="1000" r="2"/>
  <circle data-callout-anchor="rgb" cx="351" cy="110" r="2"/>
  <circle data-callout-anchor="light" cx="365" cy="998" r="2"/>
  <circle data-callout-anchor="cup" cx="512" cy="624" r="2"/>
  <circle data-callout-anchor="pico" cx="355" cy="842" r="2"/>
  <circle data-callout-anchor="current1" cx="401" cy="829" r="2"/>
 </g>
