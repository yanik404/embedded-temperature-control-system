  <path d="M122 15h33M122 23h33M122 31h33M122 39h33M122 47h33" stroke="#d9dedb" stroke-width="2" opacity=".7"/>
 </g>
 <g class="component-part component-real real-current-zones" data-part="current1" aria-hidden="true"><rect x="402" y="787" width="58" height="35" rx="6" fill="none" stroke="#d2a66d" stroke-width="2" stroke-dasharray="5 4"/></g>
 <g class="component-part component-real real-current-zones" data-part="current2" aria-hidden="true"><rect x="454" y="829" width="54" height="35" rx="6" fill="none" stroke="#b58cc2" stroke-width="2" stroke-dasharray="5 4"/></g>
 <g class="component-part component-real real-current-zones" data-part="adc" aria-hidden="true"><rect x="385" y="849" width="43" height="30" rx="6" fill="none" stroke="#76aec4" stroke-width="2" stroke-dasharray="5 4"/></g>

 <!-- Physical lower light sensor with a visible optical window. -->
 <g class="component-part component-real real-light-sensor" data-part="light" filter="url(#realPartShadow)" aria-hidden="true">
  <rect x="347" y="961" width="43" height="29" rx="6" fill="#174d3d" stroke="#548577" stroke-width="2"/>
  <circle cx="368" cy="972" r="9" fill="url(#photoCell)" stroke="#b8c7a0" stroke-width="2"/>
  <path d="M354 988v7M383 988v7" stroke="#cbd1cd" stroke-width="2"/>
 </g>

 <!-- OLED and four physical buttons remain in the lower STEP recess. -->
 <g class="component-part component-real real-oled" data-part="oled" filter="url(#realPartShadow)" aria-hidden="true">
  <path d="M531 841l111 9v106l-111-5z" fill="#0a1010" stroke="#51605b" stroke-width="4"/>
