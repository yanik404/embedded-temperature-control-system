<svg class="product-illustration product-v2-illustration product-v2-cutaway product-step-render" id="productV2Cutaway" viewBox="0 0 702 1100" role="img" aria-labelledby="productCutTitle productCutDescription" xmlns="http://www.w3.org/2000/svg">
 <title id="productCutTitle">ThermoCup MK I Innenansicht</title>
 <desc id="productCutDescription">Einheitliche fotorealistische Schnittansicht derselben STEP-Gehäusegeometrie: tief eingesetzter Becher, zwei seitliche Peltierkontakte, zwei TMP36, dreipoliger Hebel-Mikroschalter, ein horizontaler Lüfter, originales 80-mm-PCB mit Pico W sowie eingelassenes OLED und vier Taster.</desc>
 <image href="__PRODUCT_CUTAWAY__" x="0" y="0" width="702" height="1100" preserveAspectRatio="xMidYMid meet"/>

 <!-- Invisible, focusable interaction geometry; no visible component sprites. -->
 <g class="step-interaction-layer" fill="transparent" stroke="transparent">
  <rect class="component-part step-hotspot" data-part="temp1" data-focus="temp1" x="444" y="65" width="63" height="113" rx="16" tabindex="0" role="button" aria-label="TMP36 Sensor 1 als dreipoliges TO-92-Bauteil oben seitlich am Becher"/>
  <rect class="component-part step-hotspot" data-part="temp2" data-focus="temp2" x="335" y="578" width="102" height="111" rx="22" tabindex="0" role="button" aria-label="TMP36 Sensor 2 auf kompaktem Federkontakt mittig unter dem Becher"/>
  <rect class="component-part step-hotspot" data-part="peltier1" data-focus="peltier1" x="238" y="218" width="109" height="365" rx="14" tabindex="0" role="button" aria-label="Peltier links mit weißer Keramik und gebürstetem Metallkontakt"/>
  <rect class="component-part step-hotspot" data-part="peltier2" data-focus="peltier2" x="450" y="218" width="110" height="365" rx="14" tabindex="0" role="button" aria-label="Peltier rechts mit weißer Keramik und gebürstetem Metallkontakt"/>
  <rect class="component-part step-hotspot" data-part="fan" data-focus="fan" x="230" y="591" width="303" height="196" rx="28" tabindex="0" role="button" aria-label="Ein einzelner horizontaler 4-Pin PWM-Lüfter unter dem Becher"/>
  <rect class="component-part step-hotspot" data-part="oled" data-focus="oled" x="529" y="827" width="111" height="151" rx="18" tabindex="0" role="button" aria-label="SSD1306 OLED vollständig in der unteren Frontaussparung"/>
  <rect class="component-part step-hotspot" data-part="buttons" data-focus="buttons" x="525" y="946" width="119" height="81" rx="18" tabindex="0" role="button" aria-label="Vier eingelassene Taster MODE, DOWN, OK und UP direkt unter dem OLED"/>
  <ellipse class="component-part step-hotspot" data-part="rgb" data-focus="rgb" cx="351" cy="110" rx="250" ry="90" tabindex="0" role="button" aria-label="RGB-Statusring im oberen Becherbereich"/>
  <rect class="component-part step-hotspot" data-part="light" data-focus="light" x="321" y="911" width="82" height="84" rx="20" tabindex="0" role="button" aria-label="Kleiner optischer Lichtsensor in der untersten Frontöffnung"/>
  <rect class="component-part step-hotspot" data-part="cup" data-focus="cup" x="488" y="158" width="112" height="175" rx="20" tabindex="0" role="button" aria-label="Dreipoliger seitlicher Mikroschalter mit langem Metallhebel zur Bechererkennung"/>
  <ellipse class="component-part step-hotspot" data-part="pico" data-focus="pico" cx="400" cy="824" rx="210" ry="108" tabindex="0" role="button" aria-label="Originales 80-Millimeter-Haupt-PCB mit darauf montiertem Raspberry Pi Pico W"/>
  <rect class="component-part step-hotspot" data-part="current1" data-focus="current1" x="448" y="748" width="126" height="148" rx="24" tabindex="0" role="button" aria-label="TLA2024 und Strommessung auf dem originalen Haupt-PCB"/>
 </g>

