<svg class="product-illustration product-v2-illustration product-v2-cutaway product-step-render" id="productV2Cutaway" viewBox="0 0 702 1100" role="img" aria-labelledby="productCutTitle productCutDescription" xmlns="http://www.w3.org/2000/svg">
 <title id="productCutTitle">ThermoCup MK I Innenansicht</title>
 <desc id="productCutDescription">Fotorealistische Schnittansicht derselben STEP-Gehäusegeometrie: zwei Peltierkontakte auf Becherhöhe, gefederter TMP36 darunter, ein horizontaler Lüfter, das 80-mm-PCB und die unteren Bedienelemente.</desc>
 <image href="__PRODUCT_CUTAWAY__" x="0" y="0" width="702" height="1100" preserveAspectRatio="xMidYMid meet"/>

 <g class="step-interaction-layer" fill="transparent" stroke="transparent">
  <rect class="component-part step-hotspot" data-part="temp1" data-focus="temp1" x="215" y="202" width="76" height="95" rx="16" tabindex="0" role="button" aria-label="TMP36 Sensor 1 oben seitlich am Becher"/>
  <rect class="component-part step-hotspot" data-part="temp2" data-focus="temp2" x="332" y="607" width="78" height="74" rx="20" tabindex="0" role="button" aria-label="TMP36 Sensor 2 mit Federkontakt mittig unter dem Becher"/>
  <rect class="component-part step-hotspot" data-part="peltier1" data-focus="peltier1" x="238" y="281" width="85" height="284" rx="12" tabindex="0" role="button" aria-label="Peltier links auf Becherhöhe"/>
  <rect class="component-part step-hotspot" data-part="peltier2" data-focus="peltier2" x="478" y="291" width="76" height="278" rx="12" tabindex="0" role="button" aria-label="Peltier rechts gegenüber auf Becherhöhe"/>
  <circle class="component-part step-hotspot" data-part="fan" data-focus="fan" cx="374" cy="710" r="105" tabindex="0" role="button" aria-label="Einzelner horizontaler Lüfter direkt unter dem Becher"/>
  <rect class="component-part step-hotspot" data-part="oled" data-focus="oled" x="535" y="835" width="122" height="143" rx="16" tabindex="0" role="button" aria-label="SSD1306 OLED in der unteren Frontaussparung"/>
  <rect class="component-part step-hotspot" data-part="buttons" data-focus="buttons" x="530" y="955" width="132" height="80" rx="18" tabindex="0" role="button" aria-label="Vier Taster direkt unter dem OLED"/>
  <ellipse class="component-part step-hotspot" data-part="rgb" data-focus="rgb" cx="351" cy="108" rx="245" ry="88" tabindex="0" role="button" aria-label="RGB-Statusring"/>
  <circle class="component-part step-hotspot" data-part="light" data-focus="light" cx="374" cy="987" r="43" tabindex="0" role="button" aria-label="Lichtsensor ganz unten im Gehäuse"/>
  <rect class="component-part step-hotspot" data-part="cup" data-focus="cup" x="493" y="467" width="70" height="99" rx="22" tabindex="0" role="button" aria-label="Seitliche Bechererkennung unter Peltier rechts"/>
  <ellipse class="component-part step-hotspot" data-part="pico" data-focus="pico" cx="383" cy="824" rx="205" ry="116" tabindex="0" role="button" aria-label="Originales 80-Millimeter-Haupt-PCB mit Raspberry Pi Pico W"/>
  <rect class="component-part step-hotspot" data-part="current1" data-focus="current1" x="286" y="779" width="176" height="112" rx="24" tabindex="0" role="button" aria-label="TLA2024 und Strommessung auf dem Haupt-PCB"/>
 </g>

 <g class="callout-anchors" aria-hidden="true">
  <circle data-callout-anchor="temp1" cx="253" cy="250" r="2"/>
  <circle data-callout-anchor="temp2" cx="371" cy="644" r="2"/>
  <circle data-callout-anchor="peltier1" cx="281" cy="423" r="2"/>
  <circle data-callout-anchor="peltier2" cx="516" cy="430" r="2"/>
  <circle data-callout-anchor="fan" cx="374" cy="710" r="2"/>
  <circle data-callout-anchor="oled" cx="596" cy="907" r="2"/>
  <circle data-callout-anchor="buttons" cx="596" cy="995" r="2"/>
  <circle data-callout-anchor="rgb" cx="351" cy="108" r="2"/>
  <circle data-callout-anchor="light" cx="374" cy="987" r="2"/>
  <circle data-callout-anchor="cup" cx="528" cy="517" r="2"/>
  <circle data-callout-anchor="pico" cx="383" cy="824" r="2"/>
  <circle data-callout-anchor="current1" cx="374" cy="835" r="2"/>
 </g>
</svg>
