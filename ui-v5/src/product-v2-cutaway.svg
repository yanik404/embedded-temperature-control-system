<svg class="product-illustration product-v2-illustration product-v2-cutaway product-step-render simple-cutaway" id="productV2Cutaway" viewBox="0 0 702 1100" role="img" aria-labelledby="productCutTitle productCutDescription" xmlns="http://www.w3.org/2000/svg">
 <title id="productCutTitle">Vereinfachte Innenansicht des Becherhalters</title>
