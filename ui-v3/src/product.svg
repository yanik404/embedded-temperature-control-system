<svg class="product-illustration" id="productIllustration" viewBox="0 0 1100 760" role="img" aria-labelledby="productTitle productDescription">
 <title id="productTitle">Technische Produktillustration des Becherhalters</title>
 <desc id="productDescription">Ein konischer Getränkebecher sitzt mechanisch geführt auf einer Bodenauflage. Zwei dünne seitliche Peltiermodule, gebogene Aluminium-Kontaktbacken, zwei TMP36-Fühler, Kühlkörper, Lüfter, Hauptplatine, Pico W, OLED und vier Taster bilden einen gemeinsamen Prototyp.</desc>
