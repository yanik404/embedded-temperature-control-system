<!doctype html>
<html lang="de">
<head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>V3 Three.js Product Prototype</title><link rel="stylesheet" href="prototype.css"></head>
<body>
<div class="fallback">Three.js Produktszene wird aufgebaut …</div><div class="grain"></div>
<div class="label brand"><strong>BECHERHALTER / V3</strong><span>THREE.JS MATERIAL STUDY</span></div>
<div class="label mode">OVERVIEW · HEATING</div>
<div class="label target">w(t) SOLL&nbsp;&nbsp;<b>50,0 °C</b></div>
<div class="label temperature"><small>y(t) · ISTTEMPERATUR</small><strong>42,6</strong><em>°C</em></div>
<div class="label output"><small>u(t) · PELTIER</small><strong>68 %</strong></div>
<div class="signal"></div><div class="prototype-note">KLICK · EXPLODED VIEW</div>
<script type="module">
import * as THREE from "https://cdn.jsdelivr.net/npm/three@0.185.1/build/three.module.min.js";
const scene=new THREE.Scene();scene.background=new THREE.Color(0x03080c);scene.fog=new THREE.FogExp2(0x03080c,.055);
const camera=new THREE.PerspectiveCamera(35,innerWidth/innerHeight,.1,100);camera.position.set(7,5.2,10.5);camera.lookAt(0,.5,0);
const renderer=new THREE.WebGLRenderer({antialias:true,powerPreference:"high-performance"});renderer.setPixelRatio(Math.min(devicePixelRatio,1.5));renderer.setSize(innerWidth,innerHeight);renderer.outputColorSpace=THREE.SRGBColorSpace;renderer.toneMapping=THREE.ACESFilmicToneMapping;renderer.toneMappingExposure=1.15;renderer.shadowMap.enabled=true;renderer.shadowMap.type=THREE.PCFSoftShadowMap;document.body.prepend(renderer.domElement);
document.querySelector(".fallback").remove();
scene.add(new THREE.HemisphereLight(0x8bd9e8,0x071018,1.3));const key=new THREE.DirectionalLight(0xbceeff,3);key.position.set(5,9,6);key.castShadow=true;scene.add(key);const heatLight=new THREE.PointLight(0xff6e27,22,9,2);heatLight.position.set(0,-1.4,0);scene.add(heatLight);
const metal=new THREE.MeshPhysicalMaterial({color:0x172832,metalness:.82,roughness:.28,clearcoat:.25});const dark=new THREE.MeshStandardMaterial({color:0x08141b,metalness:.6,roughness:.38});const heat=new THREE.MeshStandardMaterial({color:0x57200d,emissive:0xff5a18,emissiveIntensity:2.5,metalness:.45,roughness:.25});const glass=new THREE.MeshPhysicalMaterial({color:0x89d7e4,transparent:true,opacity:.22,roughness:.08,metalness:.05,transmission:.35,side:THREE.DoubleSide,depthWrite:false});const liquid=new THREE.MeshPhysicalMaterial({color:0xd36b34,transparent:true,opacity:.72,roughness:.22,transmission:.08});const cyan=new THREE.MeshStandardMaterial({color:0x1c5c69,emissive:0x56dce9,emissiveIntensity:1.4});
const product=new THREE.Group();scene.add(product);function mesh(geometry,material,y){const object=new THREE.Mesh(geometry,material);object.position.y=y;object.castShadow=true;object.receiveShadow=true;product.add(object);return object}
const cup=mesh(new THREE.CylinderGeometry(2.05,1.68,4.8,64,1,true),glass,1.25);const fluid=mesh(new THREE.CylinderGeometry(1.91,1.59,3.05,64),liquid,.62);const rim=mesh(new THREE.TorusGeometry(2.05,.055,12,64),metal,3.65);rim.rotation.x=Math.PI/2;const plate=mesh(new THREE.CylinderGeometry(2.75,2.75,.25,64),heat,-1.33);const peltier=mesh(new THREE.BoxGeometry(3.6,.58,3.3),metal,-1.79);const sink=mesh(new THREE.CylinderGeometry(1.7,1.7,.45,48),dark,-2.34);const pcb=mesh(new THREE.BoxGeometry(3.3,.14,1.55),new THREE.MeshStandardMaterial({color:0x0d443f,metalness:.25,roughness:.55}),-2.88);pcb.position.x=2.7;pcb.rotation.y=-.18;
const fan=new THREE.Group();fan.position.set(0,-2.75,0);product.add(fan);const hub=new THREE.Mesh(new THREE.CylinderGeometry(.27,.27,.18,24),cyan);hub.rotation.x=Math.PI/2;fan.add(hub);for(let i=0;i<5;i++){const blade=new THREE.Mesh(new THREE.BoxGeometry(.16,.06,1.28),dark);blade.position.z=.62;blade.rotation.y=i*Math.PI*2/5;const pivot=new THREE.Group();pivot.rotation.y=i*Math.PI*2/5;pivot.add(blade);fan.add(pivot)}
const sensor=new THREE.Group();sensor.position.set(2.28,1.1,0);product.add(sensor);const probe=new THREE.Mesh(new THREE.CylinderGeometry(.055,.055,2.7,12),cyan);sensor.add(probe);const tip=new THREE.Mesh(new THREE.SphereGeometry(.14,18,12),cyan);tip.position.y=-1.3;sensor.add(tip);
const particlesGeometry=new THREE.BufferGeometry();const particleCount=150;const positions=new Float32Array(particleCount*3);for(let i=0;i<particleCount;i++){positions[i*3]=(Math.random()-.5)*3.8;positions[i*3+1]=-1.2+Math.random()*5.6;positions[i*3+2]=(Math.random()-.5)*3.2}particlesGeometry.setAttribute("position",new THREE.BufferAttribute(positions,3));const particles=new THREE.Points(particlesGeometry,new THREE.PointsMaterial({color:0xff8b43,size:.045,transparent:true,opacity:.45,blending:THREE.AdditiveBlending,depthWrite:false}));product.add(particles);
let exploded=false;addEventListener("click",()=>exploded=!exploded);let pointerX=0,pointerY=0;addEventListener("pointermove",event=>{pointerX=event.clientX/innerWidth-.5;pointerY=event.clientY/innerHeight-.5},{passive:true});const clock=new THREE.Clock();function animate(){requestAnimationFrame(animate);const t=clock.getElapsedTime();const spread=exploded?1:0;plate.position.y+=((-1.33-spread*.45)-plate.position.y)*.05;peltier.position.y+=((-1.79-spread*.9)-peltier.position.y)*.05;sink.position.y+=((-2.34-spread*1.25)-sink.position.y)*.05;fan.position.y+=((-2.75-spread*1.7)-fan.position.y)*.05;pcb.position.x+=((2.7+spread*2)-pcb.position.x)*.05;fan.rotation.y=t*4.2;particles.position.y=(t*.25)%1.2;heat.emissiveIntensity=2.2+Math.sin(t*.9)*.25;product.rotation.y+=((-.32+pointerX*.08)-product.rotation.y)*.035;product.rotation.x+=((.03+pointerY*.035)-product.rotation.x)*.035;renderer.render(scene,camera)}animate();addEventListener("resize",()=>{camera.aspect=innerWidth/innerHeight;camera.updateProjectionMatrix();renderer.setSize(innerWidth,innerHeight)});
</script></body></html>
