<!doctype html><html lang="de"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>V3 Control Study</title><style>
:root{color-scheme:dark;--bg:#03090d;--ink:#edf8fa;--muted:#68838e;--cyan:#6de7f4;--heat:#ff8a43}*{box-sizing:border-box}body{margin:0;min-height:100vh;display:grid;place-content:center;background:radial-gradient(circle at 50% 45%,#10212b,#03090d 62%);color:var(--ink);font-family:"Segoe UI Variable","Segoe UI",sans-serif;font-variant-numeric:tabular-nums}h1{margin:0 0 50px;text-align:center;font-weight:250;font-size:36px}.studies{display:flex;align-items:center;gap:90px}.study{text-align:center}.study>small{display:block;margin-top:24px;color:var(--muted);font:700 9px ui-monospace,monospace;letter-spacing:.14em}.rotary{position:relative;width:230px;height:230px;display:grid;place-content:center;border-radius:50%;background:conic-gradient(from 135deg,var(--heat) calc(var(--v)*1.8deg),#17333e 0 270deg,transparent 0)}.rotary:before{content:"";position:absolute;inset:4px;border-radius:50%;background:#061118}.rotary strong,.direct strong{position:relative;font-size:48px;font-weight:250}.rotary button,.direct button{position:absolute;top:50%;z-index:2;width:42px;height:42px;transform:translateY(-50%);border:1px solid #2b5a68;border-radius:50%;background:#07151c;color:var(--ink);font-size:22px}.rotary .down{left:-18px}.rotary .up{right:-18px}.rail{position:relative;width:82px;height:280px;margin:auto;border-left:1px solid #315b68}.rail input{position:absolute;width:270px;left:-94px;top:128px;transform:rotate(-90deg);accent-color:var(--heat)}.rail output{position:absolute;left:30px;top:calc((60 - var(--v))*6.6px);white-space:nowrap;color:var(--heat);font-size:22px}.direct{position:relative;width:250px;height:150px;display:flex;align-items:center;justify-content:space-between;border-top:1px solid #2a5260;border-bottom:1px solid #2a5260}.direct button{position:relative;top:auto;transform:none}.direct span{display:grid}.direct small{color:var(--muted)}button{cursor:pointer}button:focus-visible,input:focus-visible{outline:2px solid var(--cyan);outline-offset:3px}@media(max-width:900px){.studies{flex-direction:column;gap:60px;padding-bottom:50px}body{overflow:auto;padding:50px 0}}
</style></head><body><main><h1>V3 Sollwert · funktionale Interaktionsstudien</h1><div class="studies">
<section class="study"><div class="rotary" id="rotary" style="--v:50"><button class="down" type="button">−</button><strong><span>50,0</span>°</strong><button class="up" type="button">+</button></div><small>A · ORBITAL ROTARY</small></section>
<section class="study"><div class="rail" id="rail" style="--v:50"><input type="range" min="20" max="60" step=".5" value="50" aria-label="Vertikaler Sollwert"><output>50,0 °C</output></div><small>B · VERTICAL THERMAL RAIL</small></section>
<section class="study"><div class="direct" id="direct"><button class="down" type="button">−</button><span><strong>50,0°</strong><small>SOLLWERT</small></span><button class="up" type="button">+</button></div><small>C · DIRECT STEP CONTROL</small></section>
</div></main><script>
let value=50;const format=()=>value.toFixed(1).replace(".",",");function render(){document.querySelector(".rotary span").textContent=format();document.getElementById("rotary").style.setProperty("--v",value);document.querySelector(".direct strong").textContent=format()+"°";const range=document.querySelector("input");range.value=value;document.querySelector("output").textContent=format()+" °C";document.getElementById("rail").style.setProperty("--v",value)}document.querySelectorAll(".up").forEach(b=>b.onclick=()=>{value=Math.min(60,value+.5);render()});document.querySelectorAll(".down").forEach(b=>b.onclick=()=>{value=Math.max(20,value-.5);render()});document.querySelector("input").oninput=e=>{value=Number(e.target.value);render()};render();
</script></body></html>
