<!doctype html>
<html lang="de"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>V3 Custom WebGL Product Prototype</title><link rel="stylesheet" href="prototype.css"></head><body>
<canvas id="product"></canvas><div class="grain"></div><div class="label brand"><strong>BECHERHALTER / V3</strong><span>CUSTOM WEBGL MATERIAL STUDY</span></div><div class="label mode">THERMAL · 1 DRAW PIPELINE</div><div class="label target">w(t) SOLL&nbsp;&nbsp;<b>50,0 °C</b></div><div class="label temperature"><small>y(t) · ISTTEMPERATUR</small><strong>42,6</strong><em>°C</em></div><div class="label output"><small>u(t) · PELTIER</small><strong>68 %</strong></div><div class="signal"></div><div class="prototype-note">MAUS · KONTROLLIERTE PARALLAX</div>
<script>
const canvas=document.getElementById("product"),gl=canvas.getContext("webgl",{antialias:true});if(!gl)throw Error("WebGL unavailable");const vs=`attribute vec2 p;varying vec2 v;void main(){v=p*.5+.5;gl_Position=vec4(p,0.,1.);}`;const fs=`precision highp float;varying vec2 v;uniform vec2 r;uniform float t;uniform vec2 m;float sdBox(vec2 p,vec2 b){vec2 d=abs(p)-b;return length(max(d,0.))+min(max(d.x,d.y),0.);}float capsule(vec2 p,vec2 a,vec2 b,float radius){vec2 pa=p-a,ba=b-a;float h=clamp(dot(pa,ba)/dot(ba,ba),0.,1.);return length(pa-ba*h)-radius;}float hash(vec2 p){return fract(sin(dot(p,vec2(127.1,311.7)))*43758.5453);}float noise(vec2 p){vec2 i=floor(p),f=fract(p);f=f*f*(3.-2.*f);return mix(mix(hash(i),hash(i+vec2(1,0)),f.x),mix(hash(i+vec2(0,1)),hash(i+1.),f.x),f.y);}void main(){vec2 q=(v-.5)*vec2(r.x/r.y,1.);q-=m*.025;vec3 col=vec3(.008,.025,.037);float cup=max(sdBox(q-vec2(0,.09),vec2(.19,.27)),-length((q-vec2(0,.34))*vec2(1.,3.5))+.2);float rim=abs(length((q-vec2(0,.35))*vec2(1.,4.7))-.2)-.004;float fluid=max(sdBox(q-vec2(0,.04),vec2(.18,.18)),-length((q-vec2(0,.19))*vec2(1.,5.))+.18);float plate=abs(length((q-vec2(0,-.245))*vec2(1.,4.8))-.27)-.012;float pel=sdBox(q-vec2(0,-.31),vec2(.17,.045));float fan=abs(length(q-vec2(0,-.405))-.045)-.006;float sensor=capsule(q,vec2(.235,.26),vec2(.235,.02),.006);float thermal=exp(-length((q-vec2(0,-.23))*vec2(1.,2.8))*6.);float plume=noise(vec2(q.x*9.,q.y*4.-t*.45))*exp(-length((q-vec2(0,.05))*vec2(1.5,.65))*4.);col+=vec3(.02,.11,.15)*exp(-length(q)*2.);col=mix(col,vec3(.13,.2,.23),smoothstep(.015,0.,cup)*.7);col=mix(col,vec3(.71,.31,.14),smoothstep(.01,0.,fluid)*.72);col+=vec3(1.,.22,.035)*thermal*.55;col+=vec3(1.,.12,.015)*plume*.095;col=mix(col,vec3(.45,.87,.94),smoothstep(.007,0.,rim));col=mix(col,vec3(1.,.42,.12),smoothstep(.014,0.,plate));col=mix(col,vec3(.12,.35,.42),smoothstep(.008,0.,pel));col=mix(col,vec3(.33,.82,.9),smoothstep(.006,0.,sensor));float blades=abs(sin(atan(q.y+.405,q.x)*5.+t*5.))*smoothstep(.1,.02,length(q-vec2(0,-.405)));col+=vec3(.15,.7,.78)*blades*.35;col=mix(col,vec3(.25,.75,.82),smoothstep(.005,0.,fan));col*=smoothstep(1.05,.25,length(q));gl_FragColor=vec4(pow(col,vec3(.86)),1.);}`;function shader(type,source){const s=gl.createShader(type);gl.shaderSource(s,source);gl.compileShader(s);if(!gl.getShaderParameter(s,gl.COMPILE_STATUS))throw Error(gl.getShaderInfoLog(s));return s}const program=gl.createProgram();gl.attachShader(program,shader(gl.VERTEX_SHADER,vs));gl.attachShader(program,shader(gl.FRAGMENT_SHADER,fs));gl.linkProgram(program);gl.useProgram(program);const buffer=gl.createBuffer();gl.bindBuffer(gl.ARRAY_BUFFER,buffer);gl.bufferData(gl.ARRAY_BUFFER,new Float32Array([-1,-1,3,-1,-1,3]),gl.STATIC_DRAW);const p=gl.getAttribLocation(program,"p");gl.enableVertexAttribArray(p);gl.vertexAttribPointer(p,2,gl.FLOAT,false,0,0);const R=gl.getUniformLocation(program,"r"),T=gl.getUniformLocation(program,"t"),M=gl.getUniformLocation(program,"m");let mx=0,my=0;addEventListener("pointermove",e=>{mx=e.clientX/innerWidth-.5;my=e.clientY/innerHeight-.5},{passive:true});function frame(now){const d=Math.min(devicePixelRatio,1.5),w=innerWidth*d,h=innerHeight*d;if(canvas.width!==w||canvas.height!==h){canvas.width=w;canvas.height=h;gl.viewport(0,0,w,h)}gl.uniform2f(R,w,h);gl.uniform1f(T,now*.001);gl.uniform2f(M,mx,my);gl.drawArrays(gl.TRIANGLES,0,3);requestAnimationFrame(frame)}requestAnimationFrame(frame);
</script></body></html>
